server:
    port: 8080

spring:
    application:
        name: ai-study-assistant-backend

    datasource:
        url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ai_study_assistant}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: ${MYSQL_USER:study_user}
        password: ${MYSQL_PASSWORD:;;aduy}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            idle-timeout: 30000
            connection-timeout: 20000

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: false
        validate-on-migrate: true

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                default_batch_fetch_size: 30
                dialect: org.hibernate.dialect.MySQLDialect
                jdbc:
                    time_zone: UTC

    jackson:
        time-zone: UTC
        serialization:
            write-dates-as-timestamps: false

    servlet:
        multipart:
            max-file-size: 20MB
            max-request-size: 20MB

    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: ${MAIL_SMTP_AUTH:true}
                    starttls:
                        enable: ${MAIL_SMTP_STARTTLS:true}

logging:
    pattern:
        level: "%5p [traceId=%X{traceId:-none}]"

# Application specific configurations
app:
    jwt:
        secret: ${JWT_SECRET:super_secret_jwt_key_at_least_256_bits_long_for_security_1234567890}
        access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
        refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-4-hydrogen}
        timeout-seconds: 60
    upload:
        dir: ${UPLOAD_DIR:uploads}
    mail:
        enabled: ${MAIL_ENABLED:false}
        from: ${MAIL_FROM:noreply@aistudy.local}
    notification:
        worker-poll-ms: ${NOTIFICATION_WORKER_POLL_MS:5000}
        reminder-poll-ms: ${NOTIFICATION_REMINDER_POLL_MS:900000}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
