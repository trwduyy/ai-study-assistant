server:
    port: 8080

spring:
    application:
        name: ai-study-assistant-backend

    datasource:
        url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ai_study_assistant}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: ${MYSQL_USER:study_user}
        password: ${MYSQL_PASSWORD:;;aduy}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            idle-timeout: 30000
            connection-timeout: 20000

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                default_batch_fetch_size: 20
                dialect: org.hibernate.dialect.MySQLDialect

    servlet:
        multipart:
            max-file-size: 20MB
            max-request-size: 20MB

# Application specific configurations
app:
    jwt:
        secret: ${JWT_SECRET:super_secret_jwt_key_at_least_256_bits_long_for_security_1234567890}
        expiration-ms: 86400000 # 24 hours in milliseconds
    gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-4-hydrogen}
        timeout-seconds: 60
    upload:
        dir: ${UPLOAD_DIR:uploads}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
